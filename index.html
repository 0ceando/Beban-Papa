<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Hape Karakter</title>
<style>
:root{--bg:#000;--fg:#fff;--mut:#9a9aa2;--card:rgba(40,40,44,.72);--acc:#0a84ff;--me:#0a84ff;--them:#2c2c2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Text",Inter,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#phone{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:linear-gradient(160deg,#16213e,#0b0b12 55%,#2b1020)}
#status{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font-weight:600;font-size:15px;z-index:50;pointer-events:none}
.screen{position:absolute;inset:0;padding-top:48px;transition:transform .3s,opacity .3s}
#lock{z-index:40;display:flex;flex-direction:column;align-items:center;background:linear-gradient(160deg,#16213e,#0b0b12 55%,#2b1020)}
#lock.off{transform:translateY(-100%);pointer-events:none}
#ld{margin-top:34px;color:#ddd;font-size:17px}#lt{font-size:78px;font-weight:600;line-height:1}
#nm{margin:22px 0 8px;font-size:15px;color:var(--mut)}
#dots{display:flex;gap:16px;margin:8px 0 26px}.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}.dot.f{background:#fff}
#dots.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
#pad button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:30px}
#pad button:active{background:rgba(255,255,255,.35)}#pad .e{visibility:hidden}
#hint{margin-top:18px;font-size:13px;color:var(--mut);text-align:center;padding:0 30px}
#home{padding:60px 18px 0;overflow:auto}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.w{background:var(--card);border-radius:24px;height:140px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;backdrop-filter:blur(18px)}
.w small{color:#ff5a52;font-weight:700}.w big{font-size:46px;font-weight:500}.w span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;background:none;border:0;color:#fff}
.ic i{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:30px}
#dock{position:absolute;left:12px;right:12px;bottom:26px;height:84px;border-radius:32px;background:var(--card);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(18px)}
#app{z-index:30;background:#000;transform:translateY(100%);opacity:0;pointer-events:none;display:flex;flex-direction:column;padding-bottom:30px}
#app.show{transform:none;opacity:1;pointer-events:auto}
.hd{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;border-bottom:1px solid #222;font-size:17px}
.hd button{background:none;border:0;color:var(--acc);font-size:26px;width:40px;text-align:left}.hd span{width:40px}
.body{flex:1;overflow:auto;padding:12px 14px}
.row{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid #1d1d1f;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:#fff;text-align:left;font-size:15px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#3a3a3c;font-size:22px;flex:none}
.row small{display:block;color:var(--mut);margin-top:2px}
.b{max-width:78%;padding:9px 13px;border-radius:18px;margin:5px 0;font-size:15px;line-height:1.35;width:fit-content}
.b.me{background:var(--me);margin-left:auto}.b.them{background:var(--them)}
#in{display:flex;gap:8px;padding:8px 12px}#in input{flex:1;border-radius:20px;border:1px solid #333;background:#111;color:#fff;padding:11px 14px;font-size:16px}
#in button{border:0;border-radius:50%;width:42px;background:var(--acc);color:#fff;font-size:18px}
.note{background:#1c1c1e;border-radius:12px;padding:14px;margin-bottom:10px;width:100%;border:0;color:#fff;text-align:left;font-size:15px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.ph button{aspect-ratio:1;border:0}
.tg{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid #1d1d1f}
.tg b{width:46px;height:28px;border-radius:14px;background:#34c759;position:relative}.tg b:after{content:"";position:absolute;right:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff}.tg b.o{background:#39393d}.tg b.o:after{right:auto;left:2px}
.pw{display:flex;gap:8px;margin-top:10px}.pw input{flex:1;padding:10px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-size:16px}.pw button{border:0;border-radius:10px;padding:0 16px;background:var(--acc);color:#fff}
#bar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:6px;border-radius:3px;background:#ddd;z-index:60;border:0;padding:12px 0;background-clip:content-box;cursor:pointer}
</style></head><body>
<div id="phone">
<div id="status"><span id="clock">20:56</span><span>5G ▮▮▮</span></div>
<div id="home" class="screen"></div>
<div id="app" class="screen"></div>
<div id="lock" class="screen"><div id="ld"></div><div id="lt"></div><div id="nm"></div><div id="dots"></div><div id="pad"></div><div id="hint"></div></div>
<button id="bar" aria-label="Home"></button>
</div>
<script>
/* ====== EDIT BAGIAN INI SAJA UNTUK MENGGANTI CERITA ====== */
const CFG={
 name:"Karakter",           // nama pemilik hape
 pass:"1234",               // passcode layar kunci
 hint:"Petunjuk: tanggal lahir si pemilik, tanpa tahun (mis. 12-34)",
 city:"Jakarta", temp:"23°", weather:"Cerah",
 noteLockPass:"0707",       // password catatan terkunci
 chats:[
  {name:"Kak Sera",emoji:"👩",msgs:[["them","kamu di mana sih? dari tadi dicariin"],["them","jangan lupa besok ya"]],
   replies:["hah serius? kok baru bilang","yaudah aku tunggu. jangan telat","eh btw, kamu udah baca catatan yang aku kirim?","hmm. aku curiga deh sama kamu"]},
  {name:"Mama",emoji:"👵",msgs:[["them","nak, sudah makan?"]],
   replies:["jangan begadang terus ya","kapan pulang?","hati-hati di jalan"]}
 ],
 notes:[
  {t:"Belanja",b:"Susu, roti, kopi. Jangan lupa baterai cadangan."},
  {t:"Rahasia 🔒",b:"Kalau kamu baca ini, berarti kamu sudah terlalu jauh. Cek foto ketiga.",lock:true}
 ],
 photos:[["#ff7e5f","Sunset di atap. Hari itu semuanya masih baik-baik saja."],["#6a82fb","Selfie yang nggak jadi dikirim."],["#43cea2","Foto ketiga: tulisan di belakang kertas berbunyi “0707”."],["#f7971e","Kopi pagi."],["#8e44ad","Screenshot chat lama."],["#2c3e50","Gelap. Sengaja."]]
};
/* ========================================================= */
const $=s=>document.querySelector(s),app=$("#app");
function tick(){const d=new Date();$("#clock").textContent=d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}).replace(".",":");$("#lt").textContent=$("#clock").textContent;$("#ld").textContent=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}
tick();setInterval(tick,10000);
$("#nm").textContent="Hape "+CFG.name;$("#hint").textContent=CFG.hint;
/* lock */
let code="";const dots=$("#dots"),pad=$("#pad");
function drawDots(){dots.innerHTML=[...Array(CFG.pass.length)].map((_,i)=>`<div class="dot ${i<code.length?"f":""}"></div>`).join("")}
drawDots();
"123456789 0<".split("").forEach(k=>{const b=document.createElement("button");b.textContent=k==="<"?"⌫":k;if(k===" ")b.className="e";else b.onclick=()=>press(k);pad.appendChild(b)});
function press(k){if(k==="<")code=code.slice(0,-1);else if(code.length<CFG.pass.length)code+=k;drawDots();
 if(code.length===CFG.pass.length){if(code===CFG.pass)setTimeout(()=>$("#lock").classList.add("off"),150);else{dots.classList.add("shake");setTimeout(()=>{dots.classList.remove("shake");code="";drawDots()},450)}}}
/* home */
const APPS=[["msg","Pesan","💬","#34c759"],["notes","Catatan","📝","#ffd60a"],["photos","Foto","🌸","#fff"],["set","Pengaturan","⚙️","#8e8e93"],["x","X","𝕏","#000;border:1px solid #333"],["web","Safari","🧭","#0a84ff"],["maps","Peta","🗺️","#30d158"],["music","Musik","🎵","#ff375f"]];
$("#home").innerHTML=`<div class="wg"><div class="w"><small>${new Date().toLocaleDateString("id-ID",{weekday:"short"}).toUpperCase()}</small><big>${new Date().getDate()}</big><span>Tidak ada acara</span></div><div class="w"><b>${CFG.city}</b><big>${CFG.temp}</big><span>☀️ ${CFG.weather}</span></div></div><div class="grid">${APPS.map(a=>`<button class="ic" onclick="openApp('${a[0]}')"><i style="background:${a[3]}">${a[2]}</i>${a[1]}</button>`).join("")}</div><div id="dock">${APPS.slice(0,3).map(a=>`<button class="ic" onclick="openApp('${a[0]}')"><i style="background:${a[3]}">${a[2]}</i></button>`).join("")}</div>`;
$("#bar").onclick=()=>app.classList.remove("show");
const hd=(t,back)=>`<div class="hd"><button onclick="${back||"closeApp()"}">‹</button><b>${t}</b><span></span></div>`;
function closeApp(){app.classList.remove("show")}
function openApp(id){app.classList.add("show");const f={msg:list,notes:notes,photos:photos,set:sett}[id];f?f():other(id)}
function other(id){app.innerHTML=hd("Aplikasi")+`<div class="body" style="text-align:center;padding-top:120px;color:#9a9aa2">Aplikasi ini belum diisi.<br>Minta ke pembuat AU untuk menambahkannya.</div>`}
/* messages */
function list(){app.innerHTML=hd("Pesan")+`<div class="body">${CFG.chats.map((c,i)=>`<button class="row" onclick="chat(${i})"><div class="av">${c.emoji}</div><div><b>${c.name}</b><small>${c.msgs[c.msgs.length-1][1]}</small></div></button>`).join("")}</div>`}
function chat(i){const c=CFG.chats[i];c.n=c.n||0;
 app.innerHTML=hd(c.name,"list()")+`<div class="body" id="log"></div><div id="in"><input id="t" placeholder="Ketik pesan…" autocomplete="off"><button onclick="send(${i})">↑</button></div>`;
 c.msgs.forEach(m=>add(m[0],m[1]));$("#t").onkeydown=e=>{if(e.key==="Enter")send(i)}}
function add(w,t){const l=$("#log"),d=document.createElement("div");d.className="b "+w;d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight;return d}
function send(i){const c=CFG.chats[i],inp=$("#t"),v=inp.value.trim();if(!v)return;inp.value="";c.msgs.push(["me",v]);add("me",v);
 const ty=add("them","…");setTimeout(()=>{const r=c.replies[c.n++%c.replies.length];ty.textContent=r;c.msgs.push(["them",r]);$("#log").scrollTop=1e5},1100)}
/* notes */
function notes(){app.innerHTML=hd("Catatan")+`<div class="body">${CFG.notes.map((n,i)=>`<button class="note" onclick="note(${i})"><b>${n.t}</b></button>`).join("")}</div>`}
function note(i){const n=CFG.notes[i];if(n.lock&&!n.open){app.innerHTML=hd(n.t,"notes()")+`<div class="body">Catatan ini terkunci. Masukkan password.<div class="pw"><input id="p" type="password" placeholder="Password"><button onclick="unlock(${i})">Buka</button></div><div id="er" style="color:#ff453a;margin-top:8px"></div></div>`;return}
 app.innerHTML=hd(n.t,"notes()")+`<div class="body" style="line-height:1.5">${n.b}</div>`}
function unlock(i){if($("#p").value===CFG.noteLockPass){CFG.notes[i].open=1;note(i)}else $("#er").textContent="Password salah."}
/* photos */
function photos(){app.innerHTML=hd("Foto")+`<div class="body" style="padding:0"><div class="ph">${CFG.photos.map((p,i)=>`<button style="background:${p[0]}" onclick="photo(${i})"></button>`).join("")}</div></div>`}
function photo(i){const p=CFG.photos[i];app.innerHTML=hd("Foto","photos()")+`<div class="body"><div style="aspect-ratio:1;border-radius:14px;background:${p[0]}"></div><p style="line-height:1.5">${p[1]}</p></div>`}
/* settings */
function sett(){app.innerHTML=hd("Pengaturan")+`<div class="body"><div class="row"><div class="av">🙂</div><div><b>${CFG.name}</b><small>Apple ID</small></div></div>${["Wi-Fi","Bluetooth","Jangan Ganggu","Mode Pesawat"].map((s,i)=>`<div class="tg" onclick="this.lastChild.classList.toggle('o')">${s}<b class="${i>1?"o":""}"></b></div>`).join("")}</div>`}
</script></body></html>
